<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parque de Diversões</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="tela"></canvas>
<div id='barra'></div>
<div id='painel'></div>
<div id='painelObj'></div>
<div id='fin'><span id='finTxt'></span><button class='btn' id='btnFin'>📊 Finanças</button><button class='btn' id='btnParque'>🎡 Parque</button><button class='btn' id='btnJogo'>💾 Salvar / Carregar</button><span id='finAviso'></span></div>
<!-- Janelas: faixa de título (com ✕) + corpo dividido em seções. Esc fecha qualquer uma (ui.js). -->
<div id='modalJogo' class='modal'><div class='janela'>
  <div class='janela-topo'><h3>💾 Salvar e carregar</h3><button class='fechar' id='btnFecharJogo' title='Fechar (Esc)'>✕</button></div>
  <div class='janela-corpo'>
    <div class='linha-form'>
      <input id='inNomeSave' type='text' maxlength='40' placeholder='Nome do save' value='Meu parque' style='flex:1;min-width:0'>
      <button class='btn btn-ok' id='btnSalvar'>Salvar</button>
    </div>
    <div id='msgJogo' class='msg'></div>
    <div id='listaSaves'></div>
  </div>
</div></div>
<div id='modalFin' class='modal'><div class='janela'>
  <div class='janela-topo'><h3>📊 Finanças</h3><button class='fechar' id='btnFechar' title='Fechar (Esc)'>✕</button></div>
  <div class='janela-corpo'>
    <div class='secao'>
      <h4>🏦 Empréstimo</h4>
      <div id='empInfo'></div>
      <div class='linha-form'><label for='inJuros'>Juros mensal:</label>
        <input id='inJuros' type='number' min='0' max='100' step='0.1' style='width:80px'> %</div>
      <div class='botoes'><button class='btn' id='btnPegar'></button><button class='btn' id='btnPagar'></button></div>
    </div>
    <div class='secao'>
      <h4>📈 Balanço</h4>
      <div id='balanco'></div>
    </div>
  </div>
</div></div>
<div id='modalParque' class='modal'><div class='janela'>
  <div class='janela-topo'><h3>🎡 Parque</h3><button class='fechar' id='btnFecharParque' title='Fechar (Esc)'>✕</button></div>
  <div class='janela-corpo'>
    <div class='secao'>
      <h4>🏷️ Identidade</h4>
      <input id='inNomeParque' type='text' placeholder='Nome do parque' style='width:100%'>
    </div>
    <div class='secao'>
      <h4>🎟️ Entrada</h4>
      <div class='linha-form'><label for='inPrecoEntrada'>Preço:</label> $
        <input id='inPrecoEntrada' type='number' min='0' step='0.5' style='width:90px'></div>
      <div id='parqueDica' class='dica'></div>
    </div>
    <div class='secao'>
      <h4>🚶 Portão</h4>
      <div id='parqueInfo'></div>
    </div>
  </div>
</div></div>
<div id="hud"><b id="info">–</b><br>Convidados: <b id="qtd">0</b><br><small>Botão esquerdo: pintar/arrastar · Botão do meio: mover · Roda: zoom · Z: girar atração</small></div>


<!-- A ORDEM importa: cada arquivo usa o que foi definido nos anteriores. main.js é o último. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/dom.js"></script>
<script src="js/estado.js"></script>
<script src="js/iso.js"></script>
<script src="js/desenho.js"></script>
<script src="js/objetos.js"></script>
<script src="js/atracoes.js"></script>
<script src="js/necessidades.js"></script>
<script src="js/convidados.js"></script>
<script src="js/entrada.js"></script>
<script src="js/financas.js"></script>
<script src="js/ui.js"></script>
<script src="js/barra.js"></script>
<script src="js/salvar.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
